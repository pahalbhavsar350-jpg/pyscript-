{% extends 'base.html' %}{% block content %}<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h1>Payment Receipts</h1><a class="btn" href="/dashboard">← Dashboard</a></div><table><tr><th>Receipt</th><th>Student</th><th>Month</th><th>Amount</th><th>Date</th><th>Method</th></tr>{% for p in payments %}<tr><td>{{p.receipt_no}}</td><td>{{p.name}} ({{p.code}})</td><td>{{p.month}}</td><td>₹{{p.amount}}</td><td>{{p.paid_on}}</td><td>{{p.method}}</td></tr>{% endfor %}</table>{% endblock %}

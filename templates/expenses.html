{% extends 'base.html' %}{% block content %}<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h1>Expenses</h1><a class="btn" href="/dashboard">← Dashboard</a></div><form class="form" method="post"><div class="grid"><div><label>Title</label><input name="title" required></div><div><label>Amount</label><input type="number" step="0.01" name="amount" required></div><div><label>Date</label><input type="date" name="expense_date"></div><div><label>Category</label><input name="category"></div></div><label>Notes</label><textarea name="notes"></textarea><button class="btn">Add Expense</button></form><table><tr><th>Title</th><th>Amount</th><th>Date</th><th>Category</th></tr>{% for e in expenses %}<tr><td>{{e.title}}</td><td>₹{{e.amount}}</td><td>{{e.expense_date}}</td><td>{{e.category}}</td></tr>{% endfor %}</table>{% endblock %}

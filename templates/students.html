{% extends 'base.html' %}{% block content %}<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h1>Students</h1><a class="btn" href="/dashboard">← Dashboard</a></div><form class="form" method="post"><div class="grid"><div><label>Student Code</label><input name="code" required></div><div><label>Name</label><input name="name" required></div><div><label>Parent</label><input name="parent_name"></div><div><label>Phone</label><input name="phone"></div><div><label>Email</label><input name="email"></div><div><label>Class</label><input name="class_name"></div><div><label>Subject</label><input name="subject"></div><div><label>Batch</label><input name="batch"></div><div><label>Joining Date</label><input type="date" name="joining_date"></div><div><label>Monthly Fee</label><input type="number" step="0.01" name="monthly_fee"></div><div><label>Discount</label><input type="number" step="0.01" name="discount"></div><div><label>Status</label><select name="status"><option>Active</option><option>Inactive</option></select></div></div><label>Address</label><textarea name="address"></textarea><label>Notes</label><textarea name="notes"></textarea><button class="btn">Add Student</button></form><table><tr><th>Code</th><th>Name</th><th>Parent</th><th>Phone</th><th>Class</th><th>Fee</th><th>Status</th></tr>{% for s in students %}<tr><td>{{s.code}}</td><td>{{s.name}}</td><td>{{s.parent_name}}</td><td>{{s.phone}}</td><td>{{s.class_name}}</td><td>₹{{s.monthly_fee}}</td><td>{{s.status}}</td></tr>{% endfor %}</table>{% endblock %}

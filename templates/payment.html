{% extends 'base.html' %}{% block content %}<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h1>Record Payment</h1><a class="btn" href="/dashboard">← Dashboard</a></div><form class="form" method="post"><label>Student</label><select name="student_id" required>{% for s in students %}<option value="{{s.id}}">{{s.code}} — {{s.name}}</option>{% endfor %}</select><label>Month</label><input type="month" name="month" required><label>Amount</label><input type="number" step="0.01" name="amount" required><label>Paid On</label><input type="date" name="paid_on" required><label>Method</label><select name="method"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Card</option></select><label>Notes</label><textarea name="notes"></textarea><button class="btn">Save Payment</button></form>{% endblock %}
